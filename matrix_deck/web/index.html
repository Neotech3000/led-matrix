<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LED Matrix</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>LED Matrix</h1>
          <p>Framework Laptop 16 · 9×34 · greyscale</p>
        </div>
      </div>
      <div class="status">
        <span class="pill" id="left-pill">Left · connecting</span>
        <span class="pill" id="right-pill">Right · connecting</span>
      </div>
    </header>

    <section class="stage">
      <article class="module" data-side="left">
        <div class="module-head">
          <div>
            <h2>Left</h2>
            <p id="left-name">Flappy Bird</p>
          </div>
          <button type="button" class="side-btn active" data-focus="left">Play here</button>
        </div>
        <button type="button" class="bezel" id="left-bezel" data-side="left" aria-label="Left LED matrix">
          <canvas id="left" width="150" height="520"></canvas>
        </button>
        <div class="hud" id="left-hud"></div>
      </article>

      <article class="module" data-side="right">
        <div class="module-head">
          <div>
            <h2>Right</h2>
            <p id="right-name">Fish tank</p>
          </div>
          <button type="button" class="side-btn" data-focus="right">Play here</button>
        </div>
        <button type="button" class="bezel" id="right-bezel" data-side="right" aria-label="Right LED matrix">
          <canvas id="right" width="150" height="520"></canvas>
        </button>
        <div class="hud" id="right-hud"></div>
      </article>
    </section>

    <section class="controls">
      <div class="control-row">
        <p class="assign">Click an animation to run it on the <strong id="focus-label">left</strong> module. It loops until you pick another.</p>
        <label class="bright">
          Brightness
          <input id="brightness" type="range" min="10" max="255" value="180" />
        </label>
      </div>
      <div class="library" id="library"></div>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
