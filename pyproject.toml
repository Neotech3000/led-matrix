[project]
name = "matrix-deck"
version = "1.0.1"
description = "Flappy Bird and a fish tank on the Framework Laptop 16 LED matrices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matrix Deck" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
matrix-deck = "matrix_deck.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrix_deck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
