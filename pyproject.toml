[project]
name = "matrix-deck"
version = "2.1.0"
description = "Desktop app for the Framework Laptop 16 LED Matrix input modules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enoch Lawrence", email = "ee.adjahoe@gmail.com" }]
keywords = ["framework", "laptop-16", "led-matrix", "omarchy", "linux"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
matrix-deck = "matrix_deck.__main__:main"
led-matrix = "matrix_deck.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matrix_deck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
